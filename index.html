<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3E4">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Прототип">
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<title>Прототип мини-приложения</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap">
<style>
/* light is the default: Apple white x Nike black, volt only where it means "now" */
:root{
  --volt:#B9CB78; --volt-ink:#222C0E;
  --bg:#F2F3E4; --surface:#FDFDF7; --surface2:#E6EAD0; --ink:#232B12; --muted:#5A6244; --line:#DFE4C8; --track:#DCE2C3;
  --on:#3F4D1B; --on-ink:#F6F8E8; --accent:var(--on); --accent-ink:var(--on-ink); --accent-soft:#E6EAD0;
  --tape:#E8704E; --tape-ink:#2A0E06; --tape-text:#A5381D; --tape-soft:#F8DCCF; --ok:#2F6B0F;
  --ring:0 1px 2px rgba(48,60,20,.06),0 10px 28px rgba(48,60,20,.08);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.011em}
button{touch-action:manipulation;font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:var(--volt);color:var(--volt-ink)}
input,textarea{caret-color:var(--ink)}
:root[data-theme="dark"] input,:root[data-theme="dark"] textarea{caret-color:var(--volt)}
:focus-visible{outline:2px solid var(--on);outline-offset:2px;border-radius:8px}
.app{width:100%;max-width:430px;height:100%;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px) and (hover:hover) and (pointer:fine){
  body{align-items:center;background:#D3D8BC}
  :root[data-theme="dark"] body{background:#050703}
  .app{height:min(880px,100%);border-radius:40px;box-shadow:0 0 0 1px rgba(48,60,20,.08),0 30px 80px rgba(48,60,20,.25)}
}
@media (pointer:coarse),(max-width:599px){.app{max-width:none;border-radius:0;box-shadow:none}body{display:block}}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:inherit;text-decoration:none}
.btn,.chip,.seg button,.li,.wk,.ccard,.back,.sos,nav button{transition:transform .18s cubic-bezier(.16,1,.3,1),background-color .18s,opacity .18s}
.btn:active,.chip:active,.back:active,.sos:active{transform:scale(.97)}
.li:active,.wk:active,.ccard:active{opacity:.7}

/* header: Apple large title, Nike condensed caps */
header{background:var(--bg);padding:6px 16px 2px;display:flex;align-items:center;gap:10px;min-height:64px}
header .t{font-family:var(--display);font-size:46px;font-weight:700;text-transform:uppercase;letter-spacing:.005em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.back{width:44px;height:44px;margin-left:-6px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.sos{height:40px;padding:0 15px 0 12px;border-radius:99px;background:var(--tape-soft);color:var(--tape-text);font-weight:700;font-size:13px;letter-spacing:.06em;display:flex;align-items:center;gap:6px;flex:none}
.sos svg{width:18px;height:18px;stroke-width:2.6}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
main>*,.plan>*{flex-shrink:0}
main::-webkit-scrollbar{width:6px}main::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* tab bar */
nav{display:grid;grid-template-columns:repeat(5,1fr);margin:0 14px calc(10px + env(safe-area-inset-bottom,0px));border-radius:32px;padding:6px;gap:2px;flex:none;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(48,60,20,.12)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:26px;letter-spacing:0}
nav button[aria-current="page"]{color:var(--volt-ink);background:var(--volt)}
nav button[aria-current="page"] svg{stroke-width:2.2}

.list,.tl,.card,.panel,.fcard,.stat,.cabcard,.cstats,.abo,.subcard,.ccard,.cempty,.empty.small{box-shadow:var(--ring)}
/* type */
h2{font-family:var(--display);font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;line-height:1.1;margin:0}
h2.ttl{font-size:34px;font-weight:700;line-height:1.05}
h3{font-size:16px;font-weight:650;margin:0;line-height:1.3;letter-spacing:-.015em}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:13.5px}
.group{display:flex;flex-direction:column;gap:10px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head button{color:var(--on);font-weight:600;font-size:14px;min-height:44px;padding:0 6px;margin:-12px -6px -12px 0}
.cap{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.mm{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}

/* controls */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;letter-spacing:-.01em;width:100%}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.sm{min-height:44px;width:auto;font-size:14px;padding:0 18px}
.btn.lime{background:var(--volt-ink);color:var(--volt)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:99px;padding:4px;gap:2px}
.seg button{min-height:44px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.fl{display:flex;flex-direction:column;gap:6px}
.tag{font-size:13px;font-weight:600;color:var(--on)}

/* the time scale: the signature move */
.scale{position:relative;height:20px;margin:0 0 -6px}
.scale span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.scale.in{margin:0 16px -6px}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.tl{position:relative;border-radius:26px;background:var(--surface);overflow:hidden}

.wk{position:relative;display:block;width:100%;text-align:left;padding:14px 16px 15px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.tl.has-focus .wk:not(.on) .bar,.tl.has-focus .wk:not(.on) .eff{opacity:.4}
.wk .top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.wk .name{font-size:16.5px;font-weight:650;line-height:1.25;letter-spacing:-.015em}
.wk .min{font-family:var(--display);font-size:34px;font-weight:600;line-height:.9;flex:none;letter-spacing:0}
.wk .min small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.bar{position:relative;height:8px;margin-top:10px;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,transparent calc(25% - 1px),var(--bg) calc(25% - 1px) calc(25% + 1px),transparent calc(25% + 1px) calc(50% - 1px),var(--bg) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px) calc(75% - 1px),var(--bg) calc(75% - 1px) calc(75% + 1px),transparent calc(75% + 1px)),var(--track)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--on);transform-origin:left;animation:grow .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--n,0)*45ms)}
.bar.done i{background:var(--muted)}
.sub{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted);font-weight:500;flex-wrap:wrap;letter-spacing:0}
.eff{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.eff u{width:5px;border-radius:2px;background:var(--track);text-decoration:none}
.eff u:nth-child(1){height:6px}.eff u:nth-child(2){height:10px}.eff u:nth-child(3){height:14px}
.eff u.o{background:var(--on)}
.dn{color:var(--ok);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.more{display:none;margin-top:12px;gap:10px;flex-direction:column;position:relative}
.wk.on .more{display:flex}
.wk.on{background:var(--surface2)}
.wk.on .bar{--bg:var(--surface2)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
.noanim .bar i{animation:none}

/* today: the volt poster card */
.hero{--muted:rgba(34,44,14,.74);--track:rgba(34,44,14,.18);--bg:var(--volt);--on:#222C0E;--ink:#222C0E;
  background:var(--volt);color:var(--volt-ink);border-radius:30px;padding:18px 18px 18px;position:relative;overflow:hidden;gap:0}
.hnum{display:flex;align-items:flex-end;gap:8px;line-height:.78}
.hnum b{font-family:var(--display);font-size:156px;font-weight:700;letter-spacing:-.02em;line-height:.78;margin-left:-4px}
.hnum span{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em;line-height:1;align-self:flex-end;padding:0 0 6px}
.hero h2{font-size:30px;font-weight:700;line-height:1.05;margin:16px 0 14px}
.hero .bar{margin-top:0}
.hero .bar{background:linear-gradient(90deg,transparent calc(25% - 1px),var(--volt) calc(25% - 1px) calc(25% + 1px),transparent calc(25% + 1px) calc(50% - 1px),var(--volt) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px) calc(75% - 1px),var(--volt) calc(75% - 1px) calc(75% + 1px),transparent calc(75% + 1px)),var(--track);height:10px}
.hero .sub{margin:10px 0 16px;color:var(--volt-ink)}
.hero .eff u{background:rgba(34,44,14,.2)}.hero .eff u.o{background:var(--volt-ink)}
.hero .btn{background:var(--volt-ink);color:var(--volt)}
.hero .scale{margin-bottom:-6px}
.plan{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:24px;padding:16px}
.plan .big{display:flex;align-items:baseline;gap:6px}
.plan .big b{font-family:var(--display);font-size:54px;font-weight:700;line-height:.95}
.plan .big span{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.days u{height:10px;border-radius:99px;background:var(--track);text-decoration:none}
.days u.d{background:var(--on)}.days u.t{background:var(--volt);box-shadow:inset 0 0 0 2px var(--ink)}
.list{background:var(--surface);border-radius:26px;overflow:hidden}
.li{display:flex;gap:14px;align-items:center;padding:11px 16px;width:100%;text-align:left;border-top:1px solid var(--line);min-height:60px}
.li:first-child{border-top:0}
.li .ico{width:40px;height:40px;border-radius:50%;background:var(--surface2);color:var(--on);display:grid;place-items:center;flex:none}
.li .ico.p{background:var(--tape-soft);color:var(--tape-text)}
.li .ico.pl{background:var(--on);color:var(--on-ink)}
.ico.pl svg{fill:currentColor;stroke-width:1.5}
.li b{font-weight:650;letter-spacing:-.015em}
.grow{flex:1;min-width:0}
.chev{color:var(--muted);width:18px;height:18px}
.notice{display:flex;gap:14px;align-items:center;background:var(--surface);box-shadow:var(--ring);border-radius:28px;padding:14px 14px 14px 16px}
.notice .nico{width:44px;height:44px;border-radius:50%;background:#F6D6C7;color:#8A2F16;display:grid;place-items:center;flex:none}
.notice p{color:var(--muted);line-height:1.3}
.notice .btn{background:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.video{aspect-ratio:16/10;border-radius:30px;background:var(--volt);display:grid;place-items:center;position:relative;overflow:hidden}
.video::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-58deg,transparent 0 22px,rgba(34,44,14,.07) 22px 23px)}
.vnum{position:absolute;right:-6px;bottom:-34px;font-family:var(--display);font-size:210px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(34,44,14,.45);letter-spacing:-.02em;pointer-events:none}
.video svg{width:30px;height:30px;stroke-width:2;fill:currentColor;background:var(--volt-ink);color:var(--volt);border-radius:50%;padding:20px;box-sizing:content-box;position:relative}
.video span{position:absolute;left:18px;bottom:14px;font-size:12px;font-weight:700;color:rgba(34,44,14,.75)}
.check{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent}
.num{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--on);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;flex:none}
.link{color:var(--on);font-weight:600;font-size:14px;text-align:left;min-height:44px;display:inline-flex;align-items:center}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-align:center}

/* progress */
.sl{display:flex;flex-direction:column;gap:2px}
.sl .t{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--ink);border:0}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .r{display:flex;justify-content:space-between;font-weight:600}
.cmp .d{font-weight:700}.cmp .d.up{color:var(--ok)}.cmp .d.dn2{color:var(--tape-text)}
.trk{position:relative;height:8px;background:var(--track);border-radius:99px;margin:8px 8px}
.trk .seg2{position:absolute;top:2px;height:4px;background:var(--on);opacity:.4;border-radius:2px}
.trk b{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%)}
.trk .a{background:var(--surface);box-shadow:inset 0 0 0 3px var(--muted)}
.trk .b{background:var(--on)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{aspect-ratio:3/4;border-radius:26px;background:var(--surface);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);position:relative;overflow:hidden;text-align:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:0;border-radius:18px;padding:14px}
textarea::placeholder,.fin::placeholder{color:var(--muted)}
.ans{background:var(--surface2);border-radius:18px;padding:14px;font-size:14px}
.pill{font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink);padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:0}
.badge{font-size:12px;font-weight:700;background:var(--volt);color:var(--volt-ink);padding:2px 9px;border-radius:99px}

/* layers */
.scrim{position:absolute;inset:0;background:rgba(5,7,3,.66);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg);box-shadow:0 -12px 40px rgba(48,60,20,.18);width:100%;border-radius:32px 32px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.sheet .list{background:var(--surface)}
.toast{position:absolute;left:50%;top:50%;z-index:40;width:max-content;max-width:calc(100% - 48px);display:flex;align-items:center;gap:10px;padding:10px 20px 10px 10px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:650;box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,-46%) scale(.94);transition:opacity .24s ease,transform .28s cubic-bezier(.16,1,.3,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .ti{width:30px;height:30px;border-radius:50%;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center;flex:none}
.toast .ti svg{width:16px;height:16px;stroke-width:2.6}
.toast.err .ti{background:var(--tape);color:var(--tape-ink)}
@media (prefers-reduced-motion:reduce){.toast{transition:opacity .01s;transform:translate(-50%,-50%)}}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);align-self:center;margin:0 0 2px;flex:none}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq .chip{padding:0 6px;text-align:center;justify-content:center;background:var(--surface)}
.eq .chip[aria-pressed="true"]{background:var(--on)}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:2px}
.ck{display:flex;gap:12px;align-items:center;font-size:14px}
.ck input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--muted);display:grid;place-items:center;margin:0}
.ck input:checked{background:var(--on);box-shadow:none}
.ck input:checked::after{content:'';width:11px;height:6px;border-left:2.5px solid var(--on-ink);border-bottom:2.5px solid var(--on-ink);transform:translateY(-1px) rotate(-45deg)}
.abo{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:26px;padding:14px 16px}
.abo .nico{width:44px;height:44px;border-radius:50%;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center;flex:none}
.abo b{display:block;line-height:1.25}
.abo p{color:var(--muted);line-height:1.3}
.abo>svg{color:var(--muted)}
.fcard{background:var(--surface);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px}
.flab{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:0}
.fcard .seg{background:var(--bg)}
.fcard .chip{min-height:40px;padding:0 14px;font-size:13.5px}
.fcard .chip:not([aria-pressed="true"]){background:var(--surface2)}
.mfbtn{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;padding:0;font-size:14px;font-weight:650;color:var(--ink);text-align:left;justify-content:flex-start}
.mfbtn .mfch{margin-left:auto;transition:transform .2s;display:grid;color:var(--muted)}
.mfbtn[aria-expanded="true"] .mfch{transform:rotate(90deg)}
.mfbtn svg{width:18px;height:18px}
.found{font-size:26px}
.ccard{background:var(--surface);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ccard.on{background:#E1EAC0;box-shadow:none}
.ccard.on .st,.ccard.on .minis span,.ccard.on .btn.soft{background:#fff}
.ccard.on .minis span{color:var(--muted)}
.ccard h3{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.005em;line-height:1.05;margin-top:-2px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface2);padding:4px 11px 4px 9px;border-radius:99px;letter-spacing:0}

.st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--muted)}

/* склонение: plu(21,['день','дня','дней']) -> «21 день». Intl.PluralRules('ru') учитывает 1/21/101, 2-4, 5-20 и дроби */
const PR=new Intl.PluralRules('ru');
const plu=(n,[one,few,many])=>{const k=PR.select(n);return n+'\u00a0'+(k==='one'?one:k==='many'?many:few)};
const DAYS=['день','дня','дней'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eff=n=>`<span class="eff" role="img" aria-label="${LV[n-1]}">${[1,2,3].map(i=>`<u class="${i<=n?'o':''}"></u>`).join('')}</span>`;
const NAV=[['today','Сегодня','today'],['move','Движение','move'],['chal','Челленджи','chal'],['chat','Общение','chat'],['more','Ещё','more']];
const TG='https://t.me/katty_yoga';
const SC=60;
const scaleStrip=(c='')=>`<div class="scale ${c}" aria-hidden="true">${[0,15,30,45,60].map(m=>`<span style="left:${m/SC*100}%">${m}</span>`).join('')}</div>`;

/* ---------- screens ---------- */
function bar(w,n){return `<div class="bar ${S.done.has(w.id)?'done':''}"><i style="width:${w.min/SC*100}%;--n:${n}"></i></div>`}
function wRow(w,n,expand){
  const on=expand&&S.focus===w.id;
  return `<button class="wk ${on?'on':''}" data-act="${expand?'focus':'open'}" data-id="${w.id}" ${expand?`aria-expanded="${on}"`:''}>
   <span class="min">${w.min}<small>мин</small></span><span class="wkb"><span class="name">${w.t}</span>${bar(w,n)}
   <span class="sub">${eff(w.lv)}<span>${LV[w.lv-1]}</span><span>${CATS[w.cat]}</span>${S.fav.has(w.id)?`<span class="fv" title="В избранном">${ic('star')}</span>`:''}${S.done.has(w.id)?`<span class="dn">${ic('check')}Выполнено</span>`:''}</span>
   ${expand?`<span class="more"><span class="muted sm">${w.d}</span><span class="tag">${w.tags.map(t=>'#'+t).join('  ')}</span><span class="sm muted">${w.gear}</span>
    <span class="btn sm" role="presentation" data-act="open" data-id="${w.id}" style="width:100%">Открыть тренировку</span></span>`:''}
  </span></button>`}

const CATC={bb:'volt',mob:'sage',pil:'blush',pf:'sand',rest:'mist'};
function wTile(w,i){
  return `<button class="tile wt ${CATC[w.cat]}" data-act="open" data-id="${w.id}">
   <span class="badge2">${S.fav.has(w.id)?`<span class="fv">${ic('star')}</span>`:''}${S.done.has(w.id)?ic('check'):''}</span>
   <span class="tmin">${w.min}<small>мин</small></span>
   <span class="tt"><b>${w.t}</b>${bar(w,i)}<span class="meta">${eff(w.lv)}<span>${LV[w.lv-1]}</span></span></span></button>`}
const R={1:6,2:1,3:4};
const cprog=(n,cur,cap)=>`<span class="cprog" role="img" aria-label="День ${cur} из ${n}"><span class="cdots">${Array.from({length:n},(_,i)=>`<u class="${i<cur-1?'d':i===cur-1?'t':''}"></u>`).join('')}</span>${cap?`<span class="prow"><span>День ${cur} из ${n}</span><span>Осталось ${plu(n-cur,DAYS)}</span></span>`:''}</span>`;

function move(){
  const seg=`<div class="seg">${[['wk','Тренировки'],['ex','Разбор'],['rel','Самомассаж']].map(([k,n])=>`<button data-act="seg" data-k="${k}" aria-pressed="${S.seg===k}">${n}</button>`).join('')}</div>`;
  if(S.seg==='ex') return seg+`<div class="list">${Object.entries(EX).map(([id,e])=>`<button class="li" data-act="ex" data-id="${id}"><span class="ico">${ic('play')}</span><span class="grow"><b>${e.t}</b><span class="muted sm" style="display:block">Техника и типичные ошибки</span></span>${ic('chev','chev')}</button>`).join('')}</div>`;
  if(S.seg==='rel') return seg+`<div class="panel"><h3>Принципы самомассажа</h3><p class="muted sm">Сначала видео от эксперта, затем сессии по зонам.</p></div>
    <div class="list">${[['Стопы и голени',8],['Спина с мячом',12],['Шея и плечи',6]].map(([n,m])=>`<div class="li"><span class="grow"><b>${n}</b>${(()=>{return `<div class="bar"><i style="width:${m/SC*100}%"></i></div>`})()}</span><span><b class="mm">${m}</b> <span class="cap">мин</span></span></div>`).join('')}</div>`;
  const tags=[...new Set(W.flatMap(w=>w.tags))];
  const inTime=w=>S.time==='any'||(S.time==='15'&&w.min<=15)||(S.time==='30'&&w.min>15&&w.min<=30)||(S.time==='45'&&w.min>30);
  const res=W.filter(w=>(S.cat==='all'||w.cat===S.cat)&&inTime(w)&&(S.power==='any'||w.lv==S.power)&&S.tags.every(t=>w.tags.includes(t))&&(!S.favOnly||S.fav.has(w.id))).sort((a,b)=>b.min-a.min);
  const c=(act,k,cur,n)=>`<button class="chip" data-act="${act}" data-k="${k}" aria-pressed="${cur===k}">${n}</button>`;
  const dirty=S.cat!=='all'||S.time!=='any'||S.power!=='any'||S.tags.length||S.favOnly;
  const sg=(act,cur,arr)=>`<div class="seg" role="group">${arr.map(([k,n])=>`<button data-act="${act}" data-k="${k}" aria-pressed="${cur===k}">${n}</button>`).join('')}</div>`;
  const extra=(S.cat!=='all'?1:0)+S.tags.length;
  return seg+`<div class="fcard">
   <div class="fl"><span class="flab">Время</span>${sg('time',S.time,[['any','Любое'],['15','до 15'],['30','15–30'],['45','30+']])}</div>
   <div class="fl"><span class="flab">Нагрузка</span>${sg('power',S.power,[['any','Любая'],['1','Мало'],['2','Средне'],['3','Много']])}</div>
   <button class="favrow" data-act="favonly" aria-pressed="${S.favOnly}"><span class="fvi">${ic('star')}</span><span>Только избранные</span><span class="pill">${S.fav.size}</span><span class="sw" aria-hidden="true"></span></button>
   <button class="mfbtn" data-act="morefl" aria-expanded="${S.mf}"><span>Раздел и акцент</span>${extra?`<span class="pill">${extra}</span>`:''}<span class="mfch">${ic('chev')}</span></button>
   ${S.mf?`<div class="fl"><span class="flab">Раздел</span><div class="chips wrap">${c('cat','all',S.cat,'Все')}${Object.entries(CATS).map(([k,n])=>c('cat',k,S.cat,n)).join('')}</div></div>
   <div class="fl"><span class="flab">Акцент</span><div class="chips wrap">${tags.map(t=>`<button class="chip" data-act="tag" data-k="${t}" aria-pressed="${S.tags.includes(t)}">#${t}</button>`).join('')}</div></div>`:''}</div>
  <div class="group"><div class="head"><h2 class="found">Найдено ${res.length}</h2>${dirty?'<button data-act="reset">Сбросить</button>':''}</div>
  ${res.length?`<div class="bento">${res.map((w,i)=>wTile(w,i)).join('')}</div>`:`<div class="empty">${S.favOnly&&!S.fav.size?'В избранном пока пусто. Нажмите звезду внутри тренировки.':'Ничего не нашлось. Уберите один фильтр.'}</div>`}</div>`;
}

  <div class="group"><h2 class="ttl">${w.t}</h2>
   <div class="bento"><div class="tile w2 mist wt"><span class="tmin">${w.min}<small>мин</small></span><span class="tt">${scaleStrip()}<div class="bar" style="margin:0"><i style="width:${w.min/SC*100}%"></i></div></span></div>
    <div class="tile sand" style="min-height:112px"><span class="tt"><small style="margin:0 0 4px">Нагрузка</small><b>${LV[w.lv-1]}</b></span>${eff(w.lv)}</div>
    <div class="tile blush" style="min-height:112px"><span class="tt"><small style="margin:0 0 4px">Инвентарь</small><b>${w.gear}</b></span></div></div>
   <p>${w.d}</p><div class="tag">${w.tags.map(t=>'#'+t).join('  ')}</div></div>
  <div class="group"><h2>Упражнения</h2><div class="list">${w.ex.map((e,i)=>`<div class="li"><span class="num">${i+1}</span><span class="grow"><b>${EX[e].t}</b><button class="link" data-act="ex" data-id="${e}" style="display:block">Как делать правильно</button></span></div>`).join('')}</div></div>
  <div style="display:flex;gap:10px"><button class="btn" data-act="done" data-id="${id}">${done?ic('check')+'Выполнено':'Отметить выполненной'}</button>
  <button class="btn soft favb" data-act="fav" data-id="${id}" aria-pressed="${S.fav.has(id)}" aria-label="${S.fav.has(id)?'Убрать из избранного':'В избранное'}" style="width:54px;flex:none;padding:0">${ic('star')}</button></div>`;
}
function exDetail(id){const e=EX[id];return `<div class="video">${ic('play')}<span>Видео-разбор</span></div>
 <h2 class="ttl">${e.t}</h2>
 <div class="panel"><h3>Техника</h3>${e.steps.map((s,i)=>`<div style="display:flex;gap:12px;align-items:flex-start"><span class="num">${i+1}</span><span>${s}</span></div>`).join('')}</div>
 <div class="panel" style="background:var(--tape-soft)"><h3 style="color:var(--tape-text)">Типичные ошибки</h3>${e.err.map(s=>`<div style="display:flex;gap:10px">${ic('plus','')}<span>${s}</span></div>`).join('').replace(/<svg class="i "/g,'<svg class="i" style="transform:rotate(45deg);color:var(--tape-text);flex:none"')}</div>`}

function chal(){
  const lab={'Скоро':['soon','Скоро старт'],'Архив':['arc','Архив']};
  return `<p class="muted sm">Тематические подборки из тренировок, которые уже есть в базе.</p>`+CH.map(c=>{
  const on=S.joined.has(c.id),[cls,txt]=on?['on','Вы участвуете']:(lab[c.st]||['soon',c.st]);
  return `<div class="ccard ${on?'on':''}">
   <h3>${c.t}</h3>
   <div class="chead"><span class="st ${cls}">${txt}</span><span class="cap">Длится ${plu(c.days,DAYS)}</span></div>
   <p class="sm muted">${c.d}</p>
   ${on&&c.id===2?`<div class="prog">${cprog(c.days,9,1)}</div>`:''}
   <div class="minis">${c.picks.split(', ').map(p=>`<span>${p}</span>`).join('')}</div>
   ${c.st==='Архив'?'':`<button class="btn ${on?'soft':''}" data-act="join" data-id="${c.id}">${on?'Выйти из челленджа':'Присоединиться'}</button>`}</div>`}).join('')}

function chat(){
  const seg=`<div class="seg">${[['qa','Вопросы эксперту'],['talk','Обсуждения']].map(([k,n])=>`<button data-act="chatseg" data-k="${k}" aria-pressed="${S.chat===k}">${n}</button>`).join('')}</div>`;
  if(S.chat==='talk') return seg+`<div class="list">${[['Челлендж «Перед Новым годом»',42,3],['Питание и рецепты',18,0],['Болтушка',120,0]].map(([t,n,b])=>`<button class="li" data-act="toast" data-m="В прототипе чат не открывается"><span class="grow"><b>${t}</b><span class="muted sm" style="display:block">${plu(n,['участница','участницы','участниц'])}</span></span>${b?`<span class="badge">${b}</span>`:''}</button>`).join('')}</div><p class="note">Формат общения (чат, ветки или лента) уточняется у заказчика.</p>`;
  return seg+`<a class="abo cta" href="${TG}" target="_blank" rel="noopener" data-tg><span class="nico">${ic('user')}</span><div class="grow"><b>Записаться на индивидуальную тренировку</b><p class="sm">Один на один с тренером в Telegram</p></div>${ic('chev')}</a>
   <div class="panel"><h3>Задать вопрос</h3><textarea id="qin" rows="3" aria-label="Ваш вопрос" placeholder="Например: можно ли делать планку при диастазе?">${esc(S.qdraft)}</textarea>
   <label class="ck"><input type="checkbox" id="anon" ${S.anon?'checked':''}>Отправить анонимно</label><button class="btn sm" data-act="ask" style="align-self:flex-start">Отправить</button></div>
   <div class="group"><div class="head"><h2>Ответы эксперта</h2><span class="pill">Пример</span></div>${S.qa.map(x=>`<div class="panel"><b>${esc(x.q)}</b>${x.a?`<div class="ans">${esc(x.a)}</div>`:'<span class="sm muted">Ждёт ответа. Сообщим в Telegram, когда эксперт ответит.</span>'}</div>`).join('')}</div>`;
}

function more(){
  const it=[['nutr','food','Питание','Конструкт, рецепты, привычки'],['mind','mind','Mind','Медитации и дыхание'],['progress','prog','Прогресс','Дневник, тесты, фото, замеры'],['habit','foot','Привычки и лайфхаки','Шаги, меньше сидеть']];
  const u0=tgUser(),nm=(u0&&u0.first_name)||'Участница';
  return `<div class="bento"><button class="tile w2 row mecard" data-act="sub" data-id="me"><span class="cav">${esc(nm.trim().charAt(0).toUpperCase())}</span><span class="tt"><b>Мой кабинет</b><small>Избранное, история, абонемент</small></span>${ic('chev','chev')}</button>
  <button class="tile w2 row" data-act="story"><span class="ico">${ic('play')}</span><span class="tt"><b>О тренере и приложении</b><small>Посмотреть вступительные истории</small></span>${ic('chev','chev')}</button>

function mchart(){
  const k=S.mm,[name,unit]=MU[k];

  if(!pts.length)return `<div class="empty">Пока нет замеров. Добавьте первый ниже.</div>`;
  const sel=pts.find(p=>p.d===S.msel)||pts[pts.length-1];

  const x0=dn(pts[0].d),x1=dn(pts[pts.length-1].d),iw=W-L-R;
  const X=d=>pts.length===1||x1===x0?L+iw/2:L+(dn(d)-x0)/(x1-x0)*iw;
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const rd=v=>k==='w'?Math.round(v*10)/10:Math.round(v);
  const ticks=[hi,(hi+lo)/2,lo].map(v=>({y:Y(v),t:fmt(rd(v))}));

  const first=pts[0],last=pts[pts.length-1];

   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${t.y.toFixed(1)}" y2="${t.y.toFixed(1)}" class="gl"/><text x="${L-6}" y="${(t.y+4).toFixed(1)}" text-anchor="end">${t.t}</text>`).join('')}
   ${area?`<path d="${area}" fill="url(#mg)"/>`:''}
   ${pts.length>1?`<path d="${path}" class="ln"/>`:''}
   <line x1="${X(sel.d).toFixed(1)}" x2="${X(sel.d).toFixed(1)}" y1="${T}" y2="${base}" class="sg"/>
   ${pts.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p[k]).toFixed(1)}" r="${p===sel?6:4}" class="${p===sel?'pt on':'pt'}"/>`).join('')}
   ${lab(first,pts.length>1?'start':'middle')}${mid?lab(mid,'middle'):''}${pts.length>1?lab(last,'end'):''}
   ${pts.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p[k]).toFixed(1)}" r="16" fill="transparent" data-act="pt" data-d="${p.d}"><title>${dLong(p.d)}: ${fmt(p[k])} ${unit}</title></circle>`).join('')}
  </svg>`;
}

  else if(a==='power'){S.power=d.k;S.focus=null}
  else if(a==='tag'){S.tags=S.tags.includes(d.k)?S.tags.filter(x=>x!==d.k):[...S.tags,d.k];S.focus=null}
  else if(a==='favonly'){S.favOnly=!S.favOnly;S.focus=null}
  else if(a==='reset'){S.favOnly=false;S.cat='all';S.time='any';S.power='any';S.tags=[];S.focus=null}
  else if(a==='done'){const i=+d.id;S.done.has(i)?S.done.delete(i):S.done.add(i)}
  else if(a==='fav'){const i=+d.id;S.fav.has(i)?S.fav.delete(i):S.fav.add(i);toast(S.fav.has(i)?'Добавлено в избранное':'Убрано из избранного');return}
  else if(a==='join'){const i=+d.id;S.joined.has(i)?S.joined.delete(i):S.joined.add(i)}
  else if(a==='story'){stOpen(0);return}
  else if(a==='res')S.res=d.k;
  else if(a==='chatseg')S.chat=d.k;
  else if(a==='tseg')S.tseg=d.k;
  else if(a==='cmp')S.cmp=true;
  else if(a==='tomeas'){S.tseg='meas';S.stack.push({t:'sub',id:'progress'})}
  else if(a==='mm'){S.mm=d.k;S.msel=null}
  else if(a==='pt')S.msel=d.d;
  else if(a==='medit'){const m=S.meas.find(x=>x.d===d.d);S.mform={d:m.d,w:m.w==null?'':fmt(m.w),t:m.t==null?'':fmt(m.t),h:m.h==null?'':fmt(m.h)}}
  else if(a==='mdel'){S.meas=S.meas.filter(x=>x.d!==S.mform.d);S.mform={d:todayStr(),w:'',t:'',h:''};toast('Замер удалён');return}
  else if(a==='msave'){const f=S.mform,P=x=>{x=String(x).trim().replace(',','.');return x===''?null:+x};
    const e={d:f.d,w:P(f.w),t:P(f.t),h:P(f.h)};
    const bad=(v,a,b)=>v!==null&&(!isFinite(v)||v<a||v>b);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(e.d)||e.d>todayStr()){toast('Проверьте дату');return}
    if(e.w===null&&e.t===null&&e.h===null){toast('Введите хотя бы один замер');return}
    if(bad(e.w,25,250)||bad(e.t,30,250)||bad(e.h,30,250)){toast('Проверьте значения');return}
    S.meas=S.meas.filter(x=>x.d!==e.d);S.meas.push(e);S.msel=e.d;S.mform={d:todayStr(),w:'',t:'',h:''};toast('Замер сохранён');return}
  else if(a==='ask'){const v=$('#qin').value.trim();if(!v){toast('Напишите вопрос');return}S.qa.unshift({q:($('#anon').checked?'Анонимно: ':'')+v,a:''});S.qdraft='';S.anon=false;toast('Вопрос отправлен');return}
  else if(a==='sos'){S.sos='intro';S.okd=false}
  else if(a==='sosgo'){if(!$('#okd').checked){toast('Подтвердите, что прочитали предупреждение');return}S.sos=+d.id}
  else if(a==='close'){closeLayer();return}
  else if(a==='wizard'){S.wiz=true;wiz={t:null,p:null}}
  else if(a==='w'){wiz[d.k]=d.v}
  else if(a==='wgo'){S.time=wiz.t||'any';S.power=wiz.p||'any';S.cat='all';S.tags=[];S.seg='wk';S.wiz=false;S.tab='move';S.stack=[];S.focus=null}
  else if(a==='toast'){toast(d.m);return}
  S.keep=['res','seg','cat','time','power','tag','done','join','focus','morefl','favonly','chatseg','tseg','cmp','sos','sosgo','close','w','mm','pt','medit'].includes(a);
  render();if(a==='res')countUp();if(['go','sub','back','open','ex','wgo','tomeas'].includes(a))$('#main').scrollTop=0;
  if(a==='medit'){const p=$('#mform');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}
  if(a==='cmp'){const p=$('#cmpPanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-tg]');if(!a)return;
  const w=window.Telegram&&Telegram.WebApp;if(w&&w.openTelegramLink){e.preventDefault();w.openTelegramLink(a.href)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sos||S.wiz)){closeLayer()}});
document.addEventListener('input',e=>{if(e.target.id==='qin'){S.qdraft=e.target.value;autoGrow(e.target);return}
  const mk=e.target.dataset.m;if(mk){S.mform[mk]=e.target.value;return}
  const k=e.target.dataset.d;if(k){S.diary[k]=+e.target.value;$('#v-'+k).textContent=e.target.value;if(S.cmp){S.cmp=false;const p=$('#cmpPanel');if(p)p.remove()}}});
document.addEventListener('change',e=>{if(e.target.id==='okd'){S.okd=e.target.checked;return}if(e.target.id==='anon'){S.anon=e.target.checked;return}
  const k=e.target.dataset.photo;if(!k||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.photos[k]=r.result;S.keep=true;render()};r.readAsDataURL(e.target.files[0])});
/* сохранение отметок в браузере (чтобы не пропадали при обновлении страницы) */
const KEY='miniapp-proto-v1';
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){S.fav=new Set(v.fav||[]);S.done=new Set(v.done||[]);S.joined=new Set(v.joined||[]);if(v.diary)S.diary=v.diary;if(v.meas)S.meas=v.meas;if(v.qa)S.qa=v.qa}}catch(e){}
const _render=render;
render=function(){_render();try{localStorage.setItem(KEY,JSON.stringify({fav:[...S.fav],done:[...S.done],joined:[...S.joined],diary:S.diary,meas:S.meas,qa:S.qa}))}catch(e){}};
render();

const ST=[
 {c:'volt',body:`<div class="st-bg" style="background-image:url(${PHOTO})"></div><div class="st-tint"></div><div class="st-photo" role="img" aria-label="Тренер на берегу моря" style="background-image:url(${PHOTO})"></div><h2 class="st-h">Привет!<br>Я ваш тренер</h2><p class="st-p">Помогаю женщинам двигаться бережно: когда болит спина, нужно укрепить тазовое дно, мало сил или нет времени.</p><p class="st-sub">Telegram: @katty_yoga</p>`},
 {c:'sage',body:`<h2 class="st-h">Что вы получите</h2><ul class="st-list">${[['clock','Тренировки от 5 до 55 минут','Выбираете по времени и по силам'],['mind','Бережно для спины и тазового дна','И SOS-комплекс, когда прихватило'],['play','Разбор техники','Видео и типичные ошибки'],['send','Личные занятия','Запись у тренера в Telegram']].map(([i,t,d])=>`<li><span class="st-ic">${ic(i)}</span><span><b>${t}</b><small>${d}</small></span></li>`).join('')}</ul>`},
 {c:'blush',body:`<div class="st-demo" aria-hidden="true">${[['Ягодицы за 10 минут',10],['Ягодицы + кор',30],['Полный Body Balance',55]].map(([n,m])=>`<div><div class="st-row"><span>${n}</span><b>${m}<small> мин</small></b></div><div class="bar"><i style="width:${m/60*100}%;animation:none"></i></div></div>`).join('')}</div><h2 class="st-h s">Всё в одном месте</h2><div class="st-chips">${['Движение','Питание','Mind','Привычки','Челленджи','Общение'].map(t=>`<span>${t}</span>`).join('')}</div><p class="st-p">Скажите, сколько у вас сил сегодня, и приложение подскажет тренировку.</p>`},
 {c:'sand',body:`<div class="st-demo" aria-hidden="true"><div class="st-head"><span>Самочувствие за месяц</span><span class="pill">Пример</span></div>${[['Энергия',4,7],['Сон',5,6],['Лёгкость в спине',3,6]].map(([n,a,b])=>`<div class="st-m"><div class="st-row"><span>${n}</span><span class="st-delta"><s>${a}</s><i>→</i><b>${b}</b></span></div><div class="st-seg">${Array.from({length:10},(_,i)=>`<u class="${i<a?'a':i<b?'n':''}"></u>`).join('')}</div></div>`).join('')}</div><h2 class="st-h">Видно, что меняется</h2><p class="st-p">Раз в месяц сравниваем «было» и «стало»: самочувствие, тесты, фото и замеры.</p><p class="st-sub">Без стыда и без сравнения с другими.</p>`}
];
let si=0,hold=0,holdT=0;
function stRender(){
  const el=$('#stories'),sl=ST[si],last=si===ST.length-1;
  el.innerHTML=`<div class="st-bars" aria-hidden="true">${ST.map((_,i)=>`<i class="${i<si?'done':i===si?'cur':''}"><b></b></i>`).join('')}</div>
   <button class="st-x" data-st="close" aria-label="Закрыть">${ic('plus')}</button>
   <div class="st-slide ${sl.c}">${sl.body}${last?`<div class="st-cta"><button class="btn" data-st="close">Начать</button></div>`:''}</div>
   <button class="st-prev" data-st="prev" aria-label="Назад"></button><button class="st-next" data-st="next" aria-label="Дальше"></button>`;
  stReveal(el.querySelector('.st-slide'));
  const b=el.querySelector('.st-bars i.cur b');if(b)b.addEventListener('animationend',()=>stGo(1),{once:true});
}
function stReveal(sl){
  let t=120;
  [...sl.children].forEach(n=>{
    if(n.classList.contains('st-bg')||n.classList.contains('st-tint'))return;
    if(n.tagName==='H2'){
      let k=0;const frag=document.createDocumentFragment();
      n.childNodes.forEach(c=>{
        if(c.nodeType===3){c.textContent.split(/(\s+)/).forEach(w=>{if(!w.trim()){frag.appendChild(document.createTextNode(w));return}
          const sp=document.createElement('span');sp.className='w';sp.textContent=w;sp.style.animationDelay=(t+k*120)+'ms';k++;frag.appendChild(sp)})}
        else frag.appendChild(c.cloneNode(true))});
      n.innerHTML='';n.appendChild(frag);n.style.animation='none';t+=k*120+260;return}
    if(n.tagName==='UL'){n.style.animationDelay=t+'ms';[...n.children].forEach((li,j)=>{li.style.animation='strise .7s cubic-bezier(.16,1,.3,1) both';li.style.animationDelay=(t+160+j*130)+'ms'});t+=160+n.children.length*130+80;return}
    n.style.animationDelay=t+'ms';t+=n.classList.contains('st-photo')||n.classList.contains('st-demo')?220:170});
}
function stOpen(i=0){si=i;$('#stories').hidden=false;$('#stories').classList.remove('paused');stRender();const e=$('#stories');e.tabIndex=-1;e.focus({preventScroll:true})}
function stClose(){$('#stories').hidden=true;$('#stories').innerHTML=''}
function stGo(d){const n=si+d;if(n<0){stRender();return}if(n>=ST.length){stClose();return}si=n;stRender()}
(function(){const el=$('#stories');
  el.addEventListener('pointerdown',e=>{if(!e.target.closest('.st-prev,.st-next'))return;hold=Date.now();holdT=setTimeout(()=>el.classList.add('paused'),220)});
  const up=e=>{clearTimeout(holdT);const held=Date.now()-hold>=220;el.classList.remove('paused');
    const t=e.target.closest&&e.target.closest('[data-st]');if(!t||!hold)return;hold=0;
    if(t.dataset.st==='close')stClose();else if(!held)stGo(t.dataset.st==='next'?1:-1)};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>{clearTimeout(holdT);el.classList.remove('paused');hold=0});
  el.addEventListener('click',e=>{const t=e.target.closest('[data-st]');if(!t)return;if(t.dataset.st==='close')stClose();else if(e.detail===0)stGo(t.dataset.st==='next'?1:-1)});
  document.addEventListener('keydown',e=>{if(el.hidden)return;if(e.key==='Escape')stClose();else if(e.key==='ArrowRight')stGo(1);else if(e.key==='ArrowLeft')stGo(-1)});
})();
if(!window.NOSTORY)stOpen(0);

</script>
