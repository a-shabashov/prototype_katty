<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11140B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Прототип">
<meta name="robots" content="noindex,nofollow">
<title>Прототип мини-приложения</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF0E3; --surface:#FBFCF5; --ink:#1A1E0F; --muted:#5A6044; --line:#D7DBC3; --track:#DADFC6;
  --shell:#37461C; --shell-ink:#F5F7E8; --shell-soft:#C3CE9E;
  --accent:#47591F; --accent-ink:#FFFFFF; --accent-soft:#E0E8C6;
  --tape:#E8704E; --tape-ink:#2A0E06; --tape-text:#B03418; --tape-soft:#FBE2D8;
  --lime:#C6D87A; --lime-ink:#1B2308; --sun:#F0C23E; --sun-ink:#2B2000; --ok:#1E7A4A;
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11140B; --surface:#1B2012; --ink:#EEF1E0; --muted:#A8AF8E; --line:#2E361F; --track:#2B331C; --shell:#34431A; --shell-soft:#B8C592;
  --accent:#B6C86B; --accent-ink:#11140B; --accent-soft:#2A3416;
  --tape-text:#FF9C80; --tape-soft:#3A2119; --ok:#7FD39B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11140B; --surface:#1B2012; --ink:#EEF1E0; --muted:#A8AF8E; --line:#2E361F; --track:#2B331C; --shell:#34431A; --shell-soft:#B8C592;
  --accent:#B6C86B; --accent-ink:#11140B; --accent-soft:#2A3416;
  --tape-text:#FF9C80; --tape-soft:#3A2119; --ok:#7FD39B; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{touch-action:manipulation;font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:var(--shell);color:var(--shell-ink)}
input,textarea{caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{width:100%;max-width:430px;height:100%;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px) and (hover:hover) and (pointer:fine){
  body{align-items:center;background:#D5D9C2}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#070904}}
  :root[data-theme="dark"] body{background:#070904}
  .app{height:min(880px,100%);border-radius:30px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
}
@media (pointer:coarse),(max-width:599px){.app{max-width:none;border-radius:0;box-shadow:none}body{display:block}}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell header */
header{background:var(--bg);color:var(--ink);padding:10px 14px 4px;display:flex;align-items:center;gap:10px;min-height:58px}
header .t{font-size:27px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.back{width:44px;height:44px;margin-left:-2px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.sos{height:44px;padding:0 16px 0 6px;border-radius:99px;background:var(--tape-soft);color:var(--tape-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tape-text) 22%,transparent);font-weight:800;font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:8px;flex:none}
.sos svg{width:28px;height:28px;padding:6px;border-radius:50%;background:var(--tape-text);color:var(--tape-soft);stroke-width:2.4}
main{flex:1;overflow-y:auto;padding:10px 14px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
main>*,.plan>*{flex-shrink:0}
main::-webkit-scrollbar{width:6px}main::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* nav */
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 14px calc(8px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:16px}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav button[aria-current="page"] svg{stroke-width:2.2}

/* type */
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
h3{font-size:16px;font-weight:700;margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:13px}
.group{display:flex;flex-direction:column;gap:8px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head button{color:var(--accent);font-weight:600;font-size:14px;min-height:44px;padding:0 6px;margin:-12px -6px -12px 0}
.cap{font-size:12px;font-weight:600;color:var(--muted)}

/* controls */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:44px;padding:0 15px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;width:100%}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:44px;width:auto;font-size:14px;padding:0 16px;border-radius:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--track);border-radius:13px;padding:3px;gap:3px}
.seg button{min-height:44px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;flex-direction:column;gap:4px}
.tag{font-size:13px;font-weight:600;color:var(--accent)}

/* the time scale: the signature move */
.scale{position:relative;height:20px;margin:0 0 -6px}
.scale span{position:absolute;top:0;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted)}
.scale.in{margin:0 14px -6px}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.tl{position:relative;border-radius:22px;background:var(--surface);overflow:hidden;box-shadow:0 0 0 1px var(--line)}

.wk{position:relative;display:block;width:100%;text-align:left;padding:10px 14px 11px;border-top:1px solid var(--line);transition:opacity .2s}
.wk:first-child{border-top:0}
.tl.has-focus .wk:not(.on) .bar,.tl.has-focus .wk:not(.on) .eff{opacity:.45}
.wk .top{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.wk .name{font-size:16px;font-weight:700;line-height:1.25}
.wk .min{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:none}
.wk .min small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.bar{position:relative;height:12px;margin-top:7px;border-radius:4px;background:linear-gradient(90deg,transparent calc(25% - 1px),var(--bg) calc(25% - 1px) calc(25% + 1px),transparent calc(25% + 1px) calc(50% - 1px),var(--bg) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px) calc(75% - 1px),var(--bg) calc(75% - 1px) calc(75% + 1px),transparent calc(75% + 1px)),var(--track)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);transform-origin:left;animation:grow .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--n,0)*45ms)}
.bar.done i{background:var(--ok)}
.sub{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted);font-weight:500;flex-wrap:wrap}
.eff{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.eff u{width:6px;border-radius:2px;background:var(--track);text-decoration:none}
.eff u:nth-child(1){height:6px}.eff u:nth-child(2){height:10px}.eff u:nth-child(3){height:14px}
.eff u.o{background:var(--tape)}
.dn{color:var(--ok);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.more{display:none;margin-top:12px;gap:10px;flex-direction:column;position:relative}
.wk.on .more{display:flex}
.wk.on{background:var(--accent-soft)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
.noanim .bar i{animation:none}

/* today */
.hero{background:var(--shell);color:var(--shell-ink);border-radius:24px;padding:14px 16px 14px;--bg:var(--shell);--track:rgba(255,255,255,.16);--muted:var(--shell-soft);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 28px rgba(198,216,122,.07),0 0 0 60px rgba(198,216,122,.045);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:26px;line-height:1.1}
.hero .bar i{background:var(--lime)}
.hero .min{font-size:40px!important;font-weight:800;letter-spacing:-.04em;line-height:.9}
.hero .min small{font-size:15px!important;font-weight:600}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.kick{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.li .ico.pl{background:var(--accent);color:var(--accent-ink);border-radius:50%}
.ico.pl svg{fill:currentColor;stroke-width:1.5}
.plan{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:20px;padding:13px 14px;box-shadow:0 0 0 1px var(--line)}
.plan .big{display:flex;align-items:baseline;gap:6px}
.plan .big b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.plan .big span{font-size:15px;font-weight:600;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.days u{height:12px;border-radius:2px;background:var(--track);text-decoration:none}
.days u.d{background:var(--accent)}.days u.t{background:var(--sun)}
.list{background:var(--surface);border-radius:22px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:9px 14px;width:100%;text-align:left;border-top:1px solid var(--line);min-height:52px}
.li:first-child{border-top:0}
.li .ico{width:38px;height:38px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.li .ico.p{background:var(--tape-soft);color:var(--tape-text)}
.grow{flex:1;min-width:0}
.chev{color:var(--muted)}
.notice{display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border-radius:20px;padding:12px;box-shadow:0 0 0 1px var(--line)}
.notice .nico{width:42px;height:42px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;flex:none}
.notice p{color:var(--muted);line-height:1.3}
.notice .btn{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border-radius:22px;box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.video{aspect-ratio:16/9;border-radius:24px;background:radial-gradient(circle at 78% 18%,rgba(198,216,122,.22),transparent 55%),var(--shell);color:var(--shell-ink);display:grid;place-items:center;position:relative;overflow:hidden}
.video::before{content:'';position:absolute;left:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;box-shadow:0 0 0 26px rgba(198,216,122,.07),0 0 0 56px rgba(198,216,122,.045)}
.video svg{background:var(--lime);color:var(--lime-ink);border-radius:50%;padding:17px;box-sizing:content-box;position:relative}
.video svg{width:26px;height:26px;stroke-width:2;fill:currentColor}
.video span{position:absolute;left:14px;bottom:10px;font-size:12px;font-weight:600;color:var(--shell-soft)}
.check{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--ok);box-shadow:none;color:#fff}
.num{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font);font-weight:700;font-size:14px;flex:none;font-variant-numeric:lining-nums;font-feature-settings:"ss01" 0,"salt" 0}
.link{color:var(--accent);font-weight:600;font-size:14px;text-align:left;min-height:44px;display:inline-flex;align-items:center}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-align:center}

/* progress */
.sl{display:flex;flex-direction:column;gap:2px}
.sl .t{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:0 0 0 1px var(--accent),0 2px 6px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .r{display:flex;justify-content:space-between;font-weight:600}
.cmp .d{font-weight:800}.cmp .d.up{color:var(--ok)}.cmp .d.dn2{color:var(--tape-text)}
.trk{position:relative;height:12px;background:var(--track);border-radius:4px;margin:4px 6px}
.trk .seg2{position:absolute;top:4px;height:4px;background:var(--accent);opacity:.35;border-radius:2px}
.trk b{position:absolute;top:-2px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%)}
.trk .a{background:var(--surface);box-shadow:inset 0 0 0 3px var(--muted)}
.trk .b{background:var(--accent)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{aspect-ratio:3/4;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);position:relative;overflow:hidden;text-align:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:12px}
.ans{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:14px}
.pill{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge{font-size:12px;font-weight:700;background:var(--tape);color:var(--tape-ink);padding:2px 8px;border-radius:99px}

/* layers */
.scrim{position:absolute;inset:0;background:rgba(8,10,4,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.toast{position:absolute;left:16px;right:16px;bottom:88px;background:var(--ink);color:var(--bg);padding:13px 14px;border-radius:14px;font-size:14px;font-weight:600;z-index:30;text-align:center}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);align-self:center;margin:-6px 0 2px;flex:none}
.sheet.wiz{gap:14px}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq .chip{padding:0 6px;text-align:center;justify-content:center}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:2px}
.ck{display:flex;gap:10px;align-items:center;font-size:14px}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--muted);display:grid;place-items:center;margin:0}
.ck input:checked{background:var(--accent);box-shadow:none}
.ck input:checked::after{content:'';width:10px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.ck input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:350px){header .t{font-size:22px;letter-spacing:-.02em}.sos{font-size:0;gap:0;padding:0 6px}header{gap:6px}}
.abo{display:flex;align-items:center;gap:12px;background:var(--shell);color:var(--shell-ink);border-radius:20px;padding:12px 12px 12px 14px;--muted:var(--shell-soft)}
.abo .nico{width:42px;height:42px;border-radius:14px;background:rgba(198,216,122,.16);color:var(--lime);display:grid;place-items:center;flex:none}
.abo b{display:block;line-height:1.25}
.abo p{color:var(--shell-soft);line-height:1.3}
.abo .btn{background:var(--lime);color:var(--lime-ink);flex:none}
</style>
</head>
<body>

<div class="app" id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="layer"></div>
</div>

<script>
/* ---------- icons (drawn, one stroke) ---------- */
const P={
 today:'<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
 move:'<circle cx="12" cy="5" r="2"/><path d="M12 8v6m-6-3 6-1 6 1m-9 10 3-7 3 7"/>',
 chal:'<path d="M6 21V4m0 1h11l-2.5 4L17 13H6"/>',
 chat:'<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/>',
 more:'<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
 back:'<path d="m15 5-7 7 7 7"/>',chev:'<path d="m9 5 7 7-7 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 star:'<path d="m12 4 2.4 5 5.5.7-4 3.8 1 5.5L12 16.4 7.1 19l1-5.5-4-3.8L9.6 9z"/>',
 play:'<path d="M8 5.5v13l11-6.5z"/>',cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
 mind:'<path d="M12 20c-4-2-7-5-7-9a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 4-3 7-7 9z"/>',
 food:'<path d="M5 11h14a7 7 0 0 1-14 0zM9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/>',

function chat(){
  const seg=`<div class="seg">${[['qa','Вопросы эксперту'],['talk','Обсуждения']].map(([k,n])=>`<button data-act="chatseg" data-k="${k}" aria-pressed="${S.chat===k}">${n}</button>`).join('')}</div>`;
  if(S.chat==='talk') return seg+`<div class="list">${[['Челлендж «Перед Новым годом»',42,3],['Питание и рецепты',18,0],['Болтушка',120,0]].map(([t,n,b])=>`<button class="li" data-act="toast" data-m="В прототипе чат не открывается"><span class="grow"><b>${t}</b><span class="muted sm" style="display:block">${n} участниц</span></span>${b?`<span class="badge">${b}</span>`:''}</button>`).join('')}</div><p class="note">Формат общения (чат, ветки или лента) уточняется у заказчика.</p>`;
  return seg+`<div class="panel"><h3>Задать вопрос</h3><textarea id="qin" rows="3" aria-label="Ваш вопрос" placeholder="Например: можно ли делать планку при диастазе?">${esc(S.qdraft)}</textarea>
   <label class="ck"><input type="checkbox" id="anon" ${S.anon?'checked':''}>Отправить анонимно</label><button class="btn sm" data-act="ask" style="align-self:flex-start">Отправить</button></div>
   <div class="group"><div class="head"><h2>Ответы эксперта</h2><span class="pill">Пример</span></div>${S.qa.map(x=>`<div class="panel"><b>${esc(x.q)}</b>${x.a?`<div class="ans">${esc(x.a)}</div>`:'<span class="sm muted">Ждёт ответа. Сообщим в Telegram, когда эксперт ответит.</span>'}</div>`).join('')}</div>`;
}

function more(){
  const it=[['nutr','food','Питание','Конструкт, рецепты, привычки'],['mind','mind','Mind','Медитации и дыхание'],['progress','prog','Прогресс','Дневник, тесты, фото, замеры'],['habit','foot','Привычки и лайфхаки','Шаги, меньше сидеть']];
  return `<div class="list">${it.map(([k,i,t,d])=>`<button class="li" data-act="sub" data-id="${k}"><span class="ico">${ic(i)}</span><span class="grow"><b>${t}</b><span class="muted sm" style="display:block">${d}</span></span>${ic('chev','chev')}</button>`).join('')}</div>
  <div class="abo"><span class="nico">${ic('star')}</span><div class="grow"><b>Абонемент</b><p class="sm">Активен до 23 декабря</p></div><button class="btn sm" data-act="toast" data-m="В прототипе оплата не подключена">Продлить</button></div>`}
function nutr(){return `<div class="list">${FOOD.map(f=>`<div class="li" style="align-items:flex-start"><span class="grow"><span class="kick">${f.k}</span><b style="display:block;margin-top:4px;font-size:16px">${f.t}</b><span class="sm muted">${f.d}</span></span></div>`).join('')}</div>`}
function mind(){return `<div class="list">${MIND.map(m=>`<button class="li" data-act="toast" data-m="Играет: ${m.t}"><span class="ico pl">${ic('play')}</span><span class="grow"><b>${m.t}</b><span class="muted sm" style="display:block">${m.k}</span><div class="bar"><i style="width:${m.min/SC*100}%"></i></div></span><span><b style="font-size:20px">${m.min}</b> <span class="cap">мин</span></span></button>`).join('')}</div><p class="note">Все практики светские.</p>`}
function habit(){return HAB.map((h,i)=>`<div class="panel" style="flex-direction:row;gap:14px"><span class="num" style="background:var(--accent);color:var(--accent-ink);flex:none">${i+1}</span><div class="group" style="gap:4px"><h3>${h.t}</h3><p class="sm muted">${h.d}</p></div></div>`).join('')}

function progress(){
  const seg=`<div class="seg">${[['dia','Дневник'],['test','Тесты'],['photo','Фото']].map(([k,n])=>`<button data-act="tseg" data-k="${k}" aria-pressed="${S.tseg===k}">${n}</button>`).join('')}</div>`;
  if(S.tseg==='test') return seg+`<div class="head"><p class="muted sm">Тесты вы выполняете сами: в начале месяца и через месяц.</p><span class="pill">Пример</span></div>`+TESTS.map(t=>`<div class="panel"><h3>${t.t}</h3><p class="sm muted">${t.d}</p><div class="cmp"><div class="r"><span class="muted">Старт</span><span>${t.a}</span></div><div class="r"><span class="muted">Сейчас</span><span style="color:var(--ok)">${t.b}</span></div></div></div>`).join('')+`<p class="note">Это самооценка, а не медицинская диагностика.</p>`;
  if(S.tseg==='photo') return seg+`<p class="muted sm">Селфи на старте и через месяц. Фото видите только вы. Шаг можно пропустить.</p>
   <div class="photos">${['a','b'].map(k=>`<div class="photo">${S.photos[k]?`<img alt="Фото ${k==='a'?'на старте':'через месяц'}" src="${S.photos[k]}">`:`${ic('cam')}<span>${k==='a'?'Старт':'Через месяц'}</span><span class="tag">Сделать фото</span>`}<input type="file" accept="image/*" capture="user" data-photo="${k}" aria-label="Фото: ${k==='a'?'старт':'через месяц'}"></div>`).join('')}</div>
   <div class="panel"><p class="sm muted">Здесь будет анализ по селфи. Что именно анализируем, уточняется.</p></div>`;
  const sl=DIARY.map(([k,n])=>`<div class="sl"><div class="t"><label for="d-${k}">${n}</label><span id="v-${k}">${S.diary[k]}</span></div><input type="range" id="d-${k}" min="1" max="10" value="${S.diary[k]}" data-d="${k}"></div>`).join('');
  const cmp=S.cmp?`<div class="panel" id="cmpPanel" style="box-shadow:inset 0 0 0 2px var(--accent)"><h2>Ваш месяц</h2>${DIARY.map(([k,n])=>{const d=S.diary[k]-BASE[k];const lo=Math.min(BASE[k],S.diary[k]),hi=Math.max(BASE[k],S.diary[k]);
   return `<div class="cmp"><div class="r"><span>${n}</span><span class="d ${d>0?'up':d<0?'dn2':''}">${BASE[k]} → ${S.diary[k]}  (${d>0?'+':''}${d})</span></div><div class="trk"><span class="seg2" style="left:${lo*10-5}%;width:${(hi-lo)*10}%"></span><b class="a" style="left:${BASE[k]*10-5}%"></b><b class="b" style="left:${S.diary[k]*10-5}%"></b></div></div>`}).join('')}
   <p class="sm muted">Пустой круг: месяц назад. Заполненный: сейчас. Это ваш результат, а не только цифра на весах.</p></div>`:'';
  return seg+`<div class="panel"><h2>Дневник самочувствия</h2><p class="sm muted">Оцените от 1 до 10. Сравним с первым заполнением месяц назад.</p>${sl}<button class="btn" data-act="cmp">Сохранить и сравнить</button></div>${cmp}
   <div class="panel"><div class="head"><h3>Замеры</h3><span class="pill">Пример</span></div><div class="cmp"><div class="r"><span class="muted">Вес</span><span>64,2 → 62,8 кг</span></div><div class="r"><span class="muted">Талия</span><span>74 → 71 см</span></div><div class="r"><span class="muted">Бёдра</span><span>99 → 97 см</span></div></div></div>`;
}

/* ---------- shell ---------- */
const TITLES={today:'Сегодня',move:'Движение',chal:'Челленджи',chat:'Общение',more:'Ещё'};
const SUBT={nutr:['Питание',nutr],mind:['Mind',mind],progress:['Прогресс',progress],habit:['Привычки',habit]};
let lastKey='';
function render(){
  const top=S.stack[S.stack.length-1];let title=TITLES[S.tab],body;
  if(top){if(top.t==='wk'){title='Тренировка';body=detail(top.id)}else if(top.t==='ex'){title='Разбор';body=exDetail(top.id)}else{title=SUBT[top.id][0];body=SUBT[top.id][1]()}}
  else body={today,move,chal,chat,more}[S.tab]();
  $('#hdr').innerHTML=`${S.stack.length?`<button class="back" data-act="back" aria-label="Назад">${ic('back')}</button>`:''}<span class="t">${title}</span><button class="sos" data-act="sos">${ic('sosi')}SOS</button>`;
  const m=$('#main'),sc=m.scrollTop,key=S.tab+'|'+JSON.stringify(S.stack),same=key===lastKey;lastKey=key;
  m.classList.toggle('noanim',same);m.innerHTML=body;if(same||S.keep)m.scrollTop=sc;S.keep=false;
  $('#nav').innerHTML=NAV.map(([k,n,i])=>`<button data-act="go" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ic(i)}${n}</button>`).join('');
  $('#layer').innerHTML=(S.sos?sosSheet():S.wiz?wizSheet():'')+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
}
function sosSheet(){const s=S.sos;
  if(s==='intro')return `<div class="scrim"><div class="sheet" role="dialog" aria-label="Экстренные тренировки"><i class="grab"></i><h2>Экстренные тренировки</h2>
  <p class="muted sm">Не заменяют консультацию врача. При острой боли, онемении, слабости в ноге или после травмы обратитесь к врачу.</p>
  <label class="ck"><input type="checkbox" id="okd" ${S.okd?'checked':''}>Я прочитала и понимаю</label>
  <div class="list" style="background:var(--bg)">${SOS.map(x=>`<button class="li" data-act="sosgo" data-id="${x.id}"><span class="grow"><b>${x.t}</b><span class="muted sm" style="display:block">${x.d}</span></span><span><b style="font-size:20px">${x.min}</b> <span class="cap">мин</span></span></button>`).join('')}</div>
  <button class="btn soft" data-act="close">Закрыть</button></div></div>`;
  const x=SOS.find(y=>y.id===s);return `<div class="scrim"><div class="sheet" role="dialog" aria-label="${x.t}"><h2>${x.t}</h2><p class="muted">${x.d}</p><button class="btn" data-act="toast" data-m="Видео запущено (в прототипе без видео)">${ic('play')}Начать, ${x.min} мин</button><button class="btn soft" data-act="close">Закрыть</button></div></div>`}
let wiz={t:null,p:null};
function wizSheet(){const o=(k,v,n)=>`<button class="chip" data-act="w" data-k="${k}" data-v="${v}" aria-pressed="${wiz[k]===v}">${n}</button>`;
  return `<div class="scrim"><div class="sheet wiz" role="dialog" aria-label="Подобрать тренировку"><i class="grab"></i><h2>Подобрать тренировку</h2>
  <div class="fl"><span class="cap">Сколько времени</span><div class="eq">${o('t','15','до 15 мин')}${o('t','30','15–30')}${o('t','45','30+')}</div></div>
  <div class="fl"><span class="cap">Сколько сил</span><div class="eq">${o('p','1','Мало')}${o('p','2','Средне')}${o('p','3','Много')}</div></div>
  <div class="acts"><button class="btn soft" data-act="close">Закрыть</button><button class="btn" data-act="wgo">Показать</button></div></div></div>`}
let tt;function toast(m){S.toast=m;S.keep=true;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';S.keep=true;render()},1800)}

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('scrim')&&(S.sos||S.wiz)){S.sos=null;S.wiz=false;S.keep=true;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  if(a==='go'){S.tab=d.tab;S.stack=[];S.focus=null;if(d.sub)S.stack.push({t:'sub',id:d.sub})}
  else if(a==='sub')S.stack.push({t:'sub',id:d.id});
  else if(a==='back')S.stack.pop();
  else if(a==='open'){S.stack.push({t:'wk',id:+d.id});S.focus=null}
  else if(a==='focus'){S.focus=S.focus===+d.id?null:+d.id}
  else if(a==='ex')S.stack.push({t:'ex',id:d.id});
  else if(a==='morefl')S.mf=!S.mf;
  else if(a==='seg'){S.seg=d.k;S.focus=null}
  else if(a==='cat'){S.cat=d.k;S.focus=null}
  else if(a==='time'){S.time=d.k;S.focus=null}
  else if(a==='power'){S.power=d.k;S.focus=null}
  else if(a==='tag'){S.tags=S.tags.includes(d.k)?S.tags.filter(x=>x!==d.k):[...S.tags,d.k];S.focus=null}
  else if(a==='reset'){S.cat='all';S.time='any';S.power='any';S.tags=[];S.focus=null}
  else if(a==='done'){const i=+d.id;S.done.has(i)?S.done.delete(i):S.done.add(i)}
  else if(a==='fav'){const i=+d.id;S.fav.has(i)?S.fav.delete(i):S.fav.add(i);toast(S.fav.has(i)?'Добавлено в избранное':'Убрано из избранного');return}
  else if(a==='join'){const i=+d.id;S.joined.has(i)?S.joined.delete(i):S.joined.add(i)}
  else if(a==='chatseg')S.chat=d.k;
  else if(a==='tseg')S.tseg=d.k;
  else if(a==='cmp')S.cmp=true;
  else if(a==='ask'){const v=$('#qin').value.trim();if(!v){toast('Напишите вопрос');return}S.qa.unshift({q:($('#anon').checked?'Анонимно: ':'')+v,a:''});S.qdraft='';S.anon=false;toast('Вопрос отправлен');return}
  else if(a==='sos'){S.sos='intro';S.okd=false}
  else if(a==='sosgo'){if(!$('#okd').checked){toast('Подтвердите, что прочитали предупреждение');return}S.sos=+d.id}
  else if(a==='close'){S.sos=null;S.wiz=false}
  else if(a==='wizard'){S.wiz=true;wiz={t:null,p:null}}
  else if(a==='w'){wiz[d.k]=d.v}
  else if(a==='wgo'){S.time=wiz.t||'any';S.power=wiz.p||'any';S.cat='all';S.tags=[];S.seg='wk';S.wiz=false;S.tab='move';S.stack=[];S.focus=null}
  else if(a==='toast'){toast(d.m);return}
  S.keep=['seg','cat','time','power','tag','done','join','focus','morefl','chatseg','tseg','cmp','sos','sosgo','close','w'].includes(a);
  render();if(['go','sub','back','open','ex','wgo'].includes(a))$('#main').scrollTop=0;
  if(a==='cmp'){const p=$('#cmpPanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sos||S.wiz)){S.sos=null;S.wiz=false;S.keep=true;render()}});
document.addEventListener('input',e=>{if(e.target.id==='qin'){S.qdraft=e.target.value;return}
  const k=e.target.dataset.d;if(k){S.diary[k]=+e.target.value;$('#v-'+k).textContent=e.target.value;if(S.cmp){S.cmp=false;const p=$('#cmpPanel');if(p)p.remove()}}});
document.addEventListener('change',e=>{if(e.target.id==='okd'){S.okd=e.target.checked;return}if(e.target.id==='anon'){S.anon=e.target.checked;return}
  const k=e.target.dataset.photo;if(!k||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.photos[k]=r.result;S.keep=true;render()};r.readAsDataURL(e.target.files[0])});
render();
</script>

</body>
</html>
